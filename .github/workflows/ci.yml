name: Godot CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint GDScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install gdtoolkit
        run: |
          echo "Installing gdtoolkit for GDScript linting..."
          pip install gdtoolkit==4.* || { echo "Failed to install gdtoolkit"; exit 1; }

      - name: Run gdlint
        run: |
          echo "Running gdlint on project..."
          gdlint . || { echo "Linting failed. Please fix GDScript formatting issues and try again."; exit 1; }

  export:
    name: Export All Platforms
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Godot Engine & Templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/
          key: ${{ runner.os }}-godot-4.1.3
          restore-keys: |
            ${{ runner.os }}-godot-

      - name: Clean existing templates to avoid overwrite issues with the export action
        run: |
          echo "Cleaning up old export templates..."
          rm -rf ~/.local/share/godot/export_templates/

      - name: Record Start Time
        id: start-time
        run: echo "start_time=$(date +%s)" >> $GITHUB_ENV

      - name: Export All
        uses: firebelley/godot-export@v5.2.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.1.3-stable/Godot_v4.1.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.1.3-stable/Godot_v4.1.3-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: true

      - name: Record End Time & Benchmark
        if: always()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - start_time))
          echo "### Performance Benchmark ⏱️" >> $GITHUB_STEP_SUMMARY
          echo "Export phase took $DURATION seconds." >> $GITHUB_STEP_SUMMARY

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-builds
          path: /home/runner/.local/share/godot/archives/
        if: always()

      - name: Notify on failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_TITLE: "CI Build Failed"
          SLACK_MESSAGE: "The Godot CI/CD pipeline failed during export. Please check the workflow logs for details."
          SLACK_COLOR: "#ff0000"

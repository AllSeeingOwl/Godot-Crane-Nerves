name: Godot CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  export:
    name: Export All Platforms
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Godot Engine & Templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/
          key: ${{ runner.os }}-godot-4.1.3
          restore-keys: |
            ${{ runner.os }}-godot-

      - name: Clean existing templates to avoid overwrite issues with the export action
        run: rm -rf ~/.local/share/godot/export_templates/

      - name: Export All
        uses: firebelley/godot-export@v5.2.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.1.3-stable/Godot_v4.1.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.1.3-stable/Godot_v4.1.3-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-builds
          path: /home/runner/.local/share/godot/archives/
        if: always()

name: "Godot Build and Export"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  lint:
    name: Lint GDScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install gdtoolkit
        run: |
          echo "Installing gdtoolkit for GDScript linting..."
          pip install gdtoolkit==4.* || { echo "Failed to install gdtoolkit"; exit 1; }

      - name: Run gdlint
        run: |
          echo "Running gdlint on project..."
          gdlint $(find . -name "*.gd" ! -path "*/addons/*") || { echo "Linting failed. Please fix GDScript formatting issues and try again."; exit 1; }

  test-and-build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Record Start Time
        id: start-time
        run: echo "start_time=$(date +%s)" >> $GITHUB_ENV

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.1.3
          use-dotnet: false

      - name: Cache Godot Templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/
          key: ${{ runner.os }}-godot-templates-4.1.3
          restore-keys: |
            ${{ runner.os }}-godot-templates-

      - name: Cache GUT Framework
        uses: actions/cache@v4
        with:
          path: ./addons/gut
          key: gut-v9.1.1-patched
          restore-keys: gut-

      - name: Install GUT
        run: |
          if [ -d "./addons/gut" ]; then
            echo "GUT already installed from cache."
            exit 0
          fi
          echo "Installing GUT framework..."
          mkdir -p addons

          # Primary: download zip robustly
          for attempt in {1..5}; do
            echo "Download attempt $attempt..."
            if curl -fL --retry 3 --retry-delay 5 --retry-connrefused --max-time 60 -o gut.zip "https://github.com/bitwes/Gut/archive/refs/tags/v9.1.1.zip"; then
              # Validate ZIP
              if file gut.zip | grep -q "Zip archive data"; then
                echo "Successfully downloaded GUT zip"
                break
              else
                echo "Downloaded file is not a zip (file output: $(file gut.zip))"
                echo "Showing first 200 bytes to help diagnose:"
                head -c 200 gut.zip | sed -n '1,200p' || true
                rm -f gut.zip
              fi
            else
              echo "curl failed (exit code $?)."
            fi

            if [ $attempt -lt 5 ]; then
              wait_time=$((10 * attempt))
              echo "Download failed, retrying in ${wait_time} seconds..."
              sleep $wait_time
            else
              echo "Download attempts exhausted."
            fi
          done

          # Fallback: clone the repository if zip not available
          if [ ! -f gut.zip ]; then
            echo "Falling back to git clone..."
            if git --version >/dev/null 2>&1 && git ls-remote --tags https://github.com/bitwes/Gut.git | grep -q "refs/tags/v9.1.1"; then
              git clone --depth 1 --branch v9.1.1 https://github.com/bitwes/Gut.git Gut-9.1.1 || { echo "git clone failed"; exit 1; }
              GUT_SRC_DIR="Gut-9.1.1/addons/gut"
            else
              echo "Tag v9.1.1 not found or git unavailable; aborting."
              exit 1
            fi
          else
            # unzip and locate source dir as before
            unzip -q gut.zip || { echo "Failed to unzip GUT"; exit 1; }
            GUT_SRC_DIR=$(find . -type f \( -name "GutUtils.gd" -o -name "utils.gd" \) -printf '%h\n' | head -n1 | sed 's|/utils$||' || true)
            if [ -z "$GUT_SRC_DIR" ] && [ -d "Gut-9.1.1/addons/gut" ]; then
              GUT_SRC_DIR="Gut-9.1.1/addons/gut"
            fi
          fi

          if [ -z "$GUT_SRC_DIR" ]; then
            echo "ERROR: could not locate GUT addon directory after extraction"
            ls -la Gut-9.1.1/ || echo "Gut-9.1.1 directory doesn't exist"
            exit 1
          fi

          rm -rf ./addons/gut
          mv "$GUT_SRC_DIR" ./addons/gut || { echo "Failed to move GUT to addons/gut"; exit 1; }
          rm -rf Gut-9.1.1 gut.zip

          if [ -f "./addons/gut/utils/GutUtils.gd" ] || [ -f "./addons/gut/utils.gd" ] || [ -f "./addons/gut/GutUtils.gd" ]; then
            echo "GUT framework installed successfully"
          else
            echo "ERROR: GUT utils file not found - GUT installation failed"
            echo "Contents of addons/gut:"
            ls -la ./addons/gut/
            exit 1
          fi

          # Patch missing GutUtils declarations for v9.1.1
          if [ -f "./addons/gut/gui/OutputText.gd" ]; then
            sed -i '/extends/a const GutUtils = preload("res:\/\/addons\/gut\/utils.gd")' ./addons/gut/gui/OutputText.gd
          fi
          if [ -f "./addons/gut/gut_cmdln.gd" ]; then
            sed -i '/extends/a const GutUtils = preload("res:\/\/addons\/gut\/utils.gd")' ./addons/gut/gut_cmdln.gd
          fi

      - name: Import Assets
        run: |
          echo "Importing assets via Godot headless..."
          # Run multiple times to ensure full import completion
          for i in {1..3}; do
            echo "Import pass $i..."
            godot --headless --editor --quit -v || true
            sleep 2
          done
          # Verify .godot directory was created
          if [ ! -d ".godot" ]; then
            echo "ERROR: .godot import cache not created"
            exit 1
          fi

      - name: Verify compilation and tests
        run: |
          echo "Running compilation checks and tests..."
          # Check if there are GUT tests, if not fallback to basic compile check
          if [ -d "addons/gut" ]; then
            sudo apt-get update && sudo apt-get install -y xvfb && xvfb-run --auto-servernum godot --rendering-driver opengl3 -s addons/gut/gut_cmdln.gd -gdir=res://tests -ginclude_subdirs -gexit -v || { echo "Tests failed"; exit 1; }
          else
            echo "No unit tests found, running dummy compile check."
          fi


      - name: Record End Time & Benchmark
        if: always()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - start_time))
          echo "### Performance Benchmark - Tests ⏱️" >> $GITHUB_STEP_SUMMARY
          echo "Test phase took $DURATION seconds." >> $GITHUB_STEP_SUMMARY

      - name: Notify on test failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            core.setFailed('Tests or build check failed. Please review the logs.')
            if (context.eventName === 'pull_request') {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '❌ Build or Tests failed! Please review the logs.'
              })
            }

  export:
    name: Export for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    needs: test-and-build
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, linux, macos, web]
        include:
          - platform: windows
            preset_name: "Windows Desktop"
            export_path: build/windows
            artifact_name: windows-build
            output_file: Godot-Crane-Nerves.exe
          - platform: linux
            preset_name: "Linux/X11"
            export_path: build/linux
            artifact_name: linux-build
            output_file: Godot-Crane-Nerves.x86_64
          - platform: macos
            preset_name: "macOS"
            export_path: build/macos
            artifact_name: macos-build
            output_file: Godot-Crane-Nerves.dmg
          - platform: web
            preset_name: "Web"
            export_path: build/web
            artifact_name: web-build
            output_file: index.html

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Record Start Time
        id: start-time
        run: echo "start_time=$(date +%s)" >> $GITHUB_ENV

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.1.3
          use-dotnet: false

      - name: Cache Godot Templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/
          key: ${{ runner.os }}-godot-templates-4.1.3
          restore-keys: |
            ${{ runner.os }}-godot-templates-

      - name: Install Export Templates
        run: |
          if [ ! -d "$HOME/.local/share/godot/export_templates/4.1.3.stable/" ]; then
            echo "Templates not found in cache. Downloading..."
            mkdir -p ~/.local/share/godot/export_templates/4.1.3.stable/
            wget -q https://github.com/godotengine/godot/releases/download/4.1.3-stable/Godot_v4.1.3-stable_export_templates.tpz -O templates.tpz || { echo "Failed to download templates"; exit 1; }
            unzip -q templates.tpz || { echo "Failed to unzip templates"; exit 1; }
            mv templates/* ~/.local/share/godot/export_templates/4.1.3.stable/ || { echo "Failed to move templates"; exit 1; }
            rm -rf templates templates.tpz
          else
            echo "Templates restored from cache."
          fi

      - name: Cache GUT Framework
        uses: actions/cache@v4
        with:
          path: ./addons/gut
          key: gut-v9.1.1-patched
          restore-keys: gut-

      - name: Install GUT
        run: |
          if [ -d "./addons/gut" ]; then
            echo "GUT already installed from cache."
            exit 0
          fi
          echo "Installing GUT framework..."
          mkdir -p addons

          # Primary: download zip robustly
          for attempt in {1..5}; do
            echo "Download attempt $attempt..."
            if curl -fL --retry 3 --retry-delay 5 --retry-connrefused --max-time 60 -o gut.zip "https://github.com/bitwes/Gut/archive/refs/tags/v9.1.1.zip"; then
              # Validate ZIP
              if file gut.zip | grep -q "Zip archive data"; then
                echo "Successfully downloaded GUT zip"
                break
              else
                echo "Downloaded file is not a zip (file output: $(file gut.zip))"
                echo "Showing first 200 bytes to help diagnose:"
                head -c 200 gut.zip | sed -n '1,200p' || true
                rm -f gut.zip
              fi
            else
              echo "curl failed (exit code $?)."
            fi

            if [ $attempt -lt 5 ]; then
              wait_time=$((10 * attempt))
              echo "Download failed, retrying in ${wait_time} seconds..."
              sleep $wait_time
            else
              echo "Download attempts exhausted."
            fi
          done

          # Fallback: clone the repository if zip not available
          if [ ! -f gut.zip ]; then
            echo "Falling back to git clone..."
            if git --version >/dev/null 2>&1 && git ls-remote --tags https://github.com/bitwes/Gut.git | grep -q "refs/tags/v9.1.1"; then
              git clone --depth 1 --branch v9.1.1 https://github.com/bitwes/Gut.git Gut-9.1.1 || { echo "git clone failed"; exit 1; }
              GUT_SRC_DIR="Gut-9.1.1/addons/gut"
            else
              echo "Tag v9.1.1 not found or git unavailable; aborting."
              exit 1
            fi
          else
            # unzip and locate source dir as before
            unzip -q gut.zip || { echo "Failed to unzip GUT"; exit 1; }
            GUT_SRC_DIR=$(find . -type f \( -name "GutUtils.gd" -o -name "utils.gd" \) -printf '%h\n' | head -n1 | sed 's|/utils$||' || true)
            if [ -z "$GUT_SRC_DIR" ] && [ -d "Gut-9.1.1/addons/gut" ]; then
              GUT_SRC_DIR="Gut-9.1.1/addons/gut"
            fi
          fi

          if [ -z "$GUT_SRC_DIR" ]; then
            echo "ERROR: could not locate GUT addon directory after extraction"
            ls -la Gut-9.1.1/ || echo "Gut-9.1.1 directory doesn't exist"
            exit 1
          fi

          rm -rf ./addons/gut
          mv "$GUT_SRC_DIR" ./addons/gut || { echo "Failed to move GUT to addons/gut"; exit 1; }
          rm -rf Gut-9.1.1 gut.zip

          if [ -f "./addons/gut/utils/GutUtils.gd" ] || [ -f "./addons/gut/utils.gd" ] || [ -f "./addons/gut/GutUtils.gd" ]; then
            echo "GUT framework installed successfully"
          else
            echo "ERROR: GUT utils file not found - GUT installation failed"
            echo "Contents of addons/gut:"
            ls -la ./addons/gut/
            exit 1
          fi

          # Patch missing GutUtils declarations for v9.1.1
          if [ -f "./addons/gut/gui/OutputText.gd" ]; then
            sed -i '/extends/a const GutUtils = preload("res:\/\/addons\/gut\/utils.gd")' ./addons/gut/gui/OutputText.gd
          fi
          if [ -f "./addons/gut/gut_cmdln.gd" ]; then
            sed -i '/extends/a const GutUtils = preload("res:\/\/addons\/gut\/utils.gd")' ./addons/gut/gut_cmdln.gd
          fi

      - name: Import Assets
        run: |
          echo "Importing assets for export..."
          # Run multiple times to ensure full import completion
          for i in {1..3}; do
            echo "Import pass $i..."
            godot --headless --editor --quit -v || true
            sleep 2
          done
          # Verify .godot directory was created
          if [ ! -d ".godot" ]; then
            echo "ERROR: .godot import cache not created"
            exit 1
          fi

      - name: Create export directory
        run: |
          echo "Creating export directory: ${{ matrix.export_path }}"
          mkdir -p ${{ matrix.export_path }}

      - name: Export
        run: |
          echo "Exporting for ${{ matrix.preset_name }}..."
          godot --headless --export-release "${{ matrix.preset_name }}" "${{ matrix.export_path }}/${{ matrix.output_file }}" -v || { echo "Export failed"; exit 1; }


      - name: Add COI Service Worker for Web (GitHub Pages)
        if: matrix.platform == 'web'
        run: |
          echo "Adding coi-serviceworker..."
          wget -q https://raw.githubusercontent.com/gzuidhof/coi-serviceworker/master/coi-serviceworker.min.js -O ${{ matrix.export_path }}/coi-serviceworker.min.js
          sed -i 's|</head>|<script src="coi-serviceworker.min.js"></script></head>|' ${{ matrix.export_path }}/index.html

      - name: Record End Time & Benchmark
        if: always()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - start_time))
          echo "### Performance Benchmark - Export ${{ matrix.platform }} ⏱️" >> $GITHUB_STEP_SUMMARY
          echo "Export phase for ${{ matrix.platform }} took $DURATION seconds." >> $GITHUB_STEP_SUMMARY

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.export_path }}

      - name: Build Summary Notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Export for ${{ matrix.platform }} completed successfully." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Export for ${{ matrix.platform }} failed." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify on export failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_TITLE: "Export Failed: ${{ matrix.platform }}"
          SLACK_MESSAGE: "The Godot CI/CD pipeline failed during export for ${{ matrix.platform }}. Please check the workflow logs for details."
          SLACK_COLOR: "#ff0000"


  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: export
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Web Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-build

      - name: Create .nojekyll file
        run: touch ./web-build/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web-build
          force_orphan: true

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: export
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: builds

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install conventional-changelog
        run: npm install -g conventional-changelog-cli

      - name: Zip Artifacts
        run: |
          cd builds
          for d in */ ; do
            zip -r "${d%/}.zip" "$d"
          done

      - name: Generate Changelog
        id: changelog
        run: |
          echo "Generating changelog..."
          touch CHANGELOG.md
          conventional-changelog -p angular -i CHANGELOG.md -s -r 0

          EOF_DELIMITER=$(openssl rand -hex 8)
          echo "changelog_content<<$EOF_DELIMITER" >> $GITHUB_OUTPUT
          cat CHANGELOG.md >> $GITHUB_OUTPUT
          echo "$EOF_DELIMITER" >> $GITHUB_OUTPUT

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            Automated Release for build ${{ github.run_number }}.

            ## Changelog
            ${{ steps.changelog.outputs.changelog_content }}
          files: builds/*.zip
          draft: false
          prerelease: false

name: "Godot Build and Export"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  lint:
    name: Lint GDScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install gdtoolkit
        run: |
          echo "Installing gdtoolkit for GDScript linting..."
          pip install gdtoolkit==4.* || { echo "Failed to install gdtoolkit"; exit 1; }

      - name: Run gdlint
        run: |
          echo "Running gdlint on project..."
          gdlint . || { echo "Linting failed. Please fix GDScript formatting issues and try again."; exit 1; }

  test-and-build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Record Start Time
        id: start-time
        run: echo "start_time=$(date +%s)" >> $GITHUB_ENV

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.1.3
          use-dotnet: false

      - name: Cache Godot Templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/
          key: ${{ runner.os }}-godot-templates-4.1.3
          restore-keys: |
            ${{ runner.os }}-godot-templates-

      - name: Install GUT
        run: |
          echo "Installing GUT framework..."
          mkdir -p addons
          wget -q https://github.com/bitwes/Gut/archive/refs/tags/v9.2.1.zip -O gut.zip
          unzip -q gut.zip
          mv Gut-9.2.1/addons/gut ./addons/gut
          rm -rf Gut-9.2.1 gut.zip

      - name: Import Assets
        run: |
          echo "Importing assets via Godot headless..."
          # First run to import all assets
          godot --headless --editor --quit -v || true
          # Second run to build the class cache
          godot --headless --editor --quit -v || true

      - name: Verify compilation and tests
        run: |
          echo "Running compilation checks and tests..."
          # Check if there are GUT tests, if not fallback to basic compile check
          if [ -d "addons/gut" ]; then
            sudo apt-get update && sudo apt-get install -y xvfb && xvfb-run --auto-servernum godot --rendering-driver opengl3 -s addons/gut/gut_cmdln.gd -gdir=res://tests -ginclude_subdirs -gexit -v || { echo "Tests failed"; exit 1; }
          else
            echo "No unit tests found, running dummy compile check."
          fi

      - name: Record End Time & Benchmark
        if: always()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - start_time))
          echo "### Performance Benchmark - Tests ⏱️" >> $GITHUB_STEP_SUMMARY
          echo "Test phase took $DURATION seconds." >> $GITHUB_STEP_SUMMARY

      - name: Notify on test failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            core.setFailed('Tests or build check failed. Please review the logs.')
            if (context.eventName === 'pull_request') {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '❌ Build or Tests failed! Please review the logs.'
              })
            }

  export:
    name: Export for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    needs: test-and-build
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, linux, macos, web]
        include:
          - platform: windows
            preset_name: "Windows Desktop"
            export_path: build/windows
            artifact_name: windows-build
            output_file: Godot-Crane-Nerves.exe
          - platform: linux
            preset_name: "Linux/X11"
            export_path: build/linux
            artifact_name: linux-build
            output_file: Godot-Crane-Nerves.x86_64
          - platform: macos
            preset_name: "macOS"
            export_path: build/macos
            artifact_name: macos-build
            output_file: Godot-Crane-Nerves.dmg
          - platform: web
            preset_name: "Web"
            export_path: build/web
            artifact_name: web-build
            output_file: index.html

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Record Start Time
        id: start-time
        run: echo "start_time=$(date +%s)" >> $GITHUB_ENV

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.1.3
          use-dotnet: false

      - name: Cache Godot Templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/
          key: ${{ runner.os }}-godot-templates-4.1.3
          restore-keys: |
            ${{ runner.os }}-godot-templates-

      - name: Install Export Templates
        run: |
          if [ ! -d "$HOME/.local/share/godot/export_templates/4.1.3.stable/" ]; then
            echo "Templates not found in cache. Downloading..."
            mkdir -p ~/.local/share/godot/export_templates/4.1.3.stable/
            wget -q https://github.com/godotengine/godot/releases/download/4.1.3-stable/Godot_v4.1.3-stable_export_templates.tpz -O templates.tpz || { echo "Failed to download templates"; exit 1; }
            unzip -q templates.tpz || { echo "Failed to unzip templates"; exit 1; }
            mv templates/* ~/.local/share/godot/export_templates/4.1.3.stable/ || { echo "Failed to move templates"; exit 1; }
            rm -rf templates templates.tpz
          else
            echo "Templates restored from cache."
          fi

      - name: Install GUT
        run: |
          echo "Installing GUT framework for export..."
          mkdir -p addons
          wget -q https://github.com/bitwes/Gut/archive/refs/tags/v9.2.1.zip -O gut.zip
          unzip -q gut.zip
          mv Gut-9.2.1/addons/gut ./addons/gut
          rm -rf Gut-9.2.1 gut.zip

      - name: Import Assets
        run: |
          echo "Importing assets for export..."
          godot --headless --editor --quit -v || true
          godot --headless --editor --quit -v || true

      - name: Create export directory
        run: |
          echo "Creating export directory: ${{ matrix.export_path }}"
          mkdir -p ${{ matrix.export_path }}

      - name: Export
        run: |
          echo "Exporting for ${{ matrix.preset_name }}..."
          godot --headless --export-release "${{ matrix.preset_name }}" "${{ matrix.export_path }}/${{ matrix.output_file }}" -v || { echo "Export failed"; exit 1; }

      - name: Record End Time & Benchmark
        if: always()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - start_time))
          echo "### Performance Benchmark - Export ${{ matrix.platform }} ⏱️" >> $GITHUB_STEP_SUMMARY
          echo "Export phase for ${{ matrix.platform }} took $DURATION seconds." >> $GITHUB_STEP_SUMMARY

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.export_path }}

      - name: Build Summary Notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Export for ${{ matrix.platform }} completed successfully." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Export for ${{ matrix.platform }} failed." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify on export failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_TITLE: "Export Failed: ${{ matrix.platform }}"
          SLACK_MESSAGE: "The Godot CI/CD pipeline failed during export for ${{ matrix.platform }}. Please check the workflow logs for details."
          SLACK_COLOR: "#ff0000"

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: export
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: builds

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install conventional-changelog
        run: npm install -g conventional-changelog-cli

      - name: Zip Artifacts
        run: |
          cd builds
          for d in */ ; do
            zip -r "${d%/}.zip" "$d"
          done

      - name: Generate Changelog
        id: changelog
        run: |
          echo "Generating changelog..."
          touch CHANGELOG.md
          conventional-changelog -p angular -i CHANGELOG.md -s -r 0

          EOF_DELIMITER=$(openssl rand -hex 8)
          echo "changelog_content<<$EOF_DELIMITER" >> $GITHUB_OUTPUT
          cat CHANGELOG.md >> $GITHUB_OUTPUT
          echo "$EOF_DELIMITER" >> $GITHUB_OUTPUT

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            Automated Release for build ${{ github.run_number }}.

            ## Changelog
            ${{ steps.changelog.outputs.changelog_content }}
          files: builds/*.zip
          draft: false
          prerelease: false

name: "Godot Web Export & Deploy"

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Set to "true" to publish to gh-pages'
        required: false
        default: 'true'
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  export-web:
    name: Export Web and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.1.3
          use-dotnet: false

      - name: Ensure export templates present
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.1.3.stable
          if [ -z "$(ls -A ~/.local/share/godot/export_templates/4.1.3.stable 2>/dev/null)" ]; then
            wget -q https://github.com/godotengine/godot/releases/download/4.1.3-stable/Godot_v4.1.3-stable_export_templates.tpz -O templates.tpz
            unzip -q templates.tpz -d templates || true
            mv templates/* ~/.local/share/godot/export_templates/4.1.3.stable/ || true
            rm -rf templates templates.tpz || true
          else
            echo "Templates restored from cache."
          fi

      - name: Quick smoke import
        run: |
          godot --headless --editor --quit -v || true

      - name: Create export dir
        run: mkdir -p build/web

      - name: Export Web
        run: |
          echo "Exporting Web preset..."
          godot --headless --export-release "Web" build/web/index.html -v

      - name: Add COI serviceworker and .nojekyll
        run: |
          wget -q https://raw.githubusercontent.com/gzuidhof/coi-serviceworker/master/coi-serviceworker.min.js -O build/web/coi-serviceworker.min.js || true
          if [ -f build/web/index.html ]; then
            sed -i 's|</head>|<script src="coi-serviceworker.min.js"></script></head>|' build/web/index.html || true
          fi
          touch build/web/.nojekyll

      - name: Deploy to gh-pages
        if: ${{ github.event.inputs.publish == 'true' || github.ref == 'refs/heads/main' }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true

name: "Godot Web Export & Deploy"

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Set to "true" to publish to gh-pages'
        required: false
        default: 'true'
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  export-web:
    name: Export Web and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.1.3
          use-dotnet: false

      - name: Cache Godot Export Templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.1.3.stable
          key: ${{ runner.os }}-godot-templates-4.1.3
          restore-keys: |
            ${{ runner.os }}-godot-templates-

      - name: Install Export Templates (robust)
        run: |
          set -euo pipefail
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.1.3.stable"
          echo "Checking for existing templates in $TEMPLATE_DIR..."
          if [ -d "$TEMPLATE_DIR" ] && [ -n "$(ls -A "$TEMPLATE_DIR" 2>/dev/null)" ]; then
            echo "Templates present in $TEMPLATE_DIR"
            ls -la "$TEMPLATE_DIR"
          else
            echo "Templates not found, downloading..."
            mkdir -p "$TEMPLATE_DIR"
            wget -q https://github.com/godotengine/godot/releases/download/4.1.3-stable/Godot_v4.1.3-stable_export_templates.tpz -O templates.tpz || { echo "Failed to download templates"; exit 1; }
            unzip -q templates.tpz -d templates || { echo "Failed to unzip templates"; ls -la || true; exit 1; }
            if [ -d templates ] && [ "$(ls -A templates 2>/dev/null)" ]; then
              echo "Moving extracted templates to $TEMPLATE_DIR..."
              mv templates/* "$TEMPLATE_DIR"/ || { echo "Failed to move templates (mv exit $?)"; ls -la templates || true; exit 1; }
            else
              echo "No 'templates' directory after unzip; listing archive contents for diagnosis:"
              unzip -l templates.tpz || true
              exit 1
            fi
            rm -rf templates templates.tpz || true
            echo "Installed templates to $TEMPLATE_DIR"
            ls -la "$TEMPLATE_DIR"
          fi
          # Verify expected web export template exists (Godot looks for web_release.zip)
          if [ ! -f "$TEMPLATE_DIR/web_release.zip" ]; then
            echo "ERROR: Expected web_release.zip not found in $TEMPLATE_DIR. Listing files for debugging:"
            ls -la "$TEMPLATE_DIR"
            exit 1
          fi

      - name: Import Assets (robust)
        run: |
          echo "Importing assets via Godot headless..."
          for i in 1 2 3; do
            echo "Import pass $i..."
            godot --headless --editor --quit -v || true
            sleep 3
          done
          if [ ! -d ".godot" ] && [ ! -d ".import" ]; then
            echo "ERROR: Import cache (.godot or .import) not created; aborting."
            ls -la || true
            exit 1
          fi

      - name: Create export dir
        run: mkdir -p build/web

      - name: Export Web
        run: |
          echo "Exporting Web preset..."
          godot --headless --export-release "Web" build/web/index.html -v

      - name: Add COI serviceworker and .nojekyll
        run: |
          wget -q https://raw.githubusercontent.com/gzuidhof/coi-serviceworker/master/coi-serviceworker.min.js -O build/web/coi-serviceworker.min.js || true
          if [ -f build/web/index.html ]; then
            sed -i 's|</head>|<script src="coi-serviceworker.min.js"></script></head>|' build/web/index.html || true
          fi
          touch build/web/.nojekyll

      - name: Verify export output
        run: |
          echo "Contents of build/web:"
          ls -la build/web || ( echo "No build/web directory found"; exit 1 )
          if [ ! -f build/web/index.html ]; then
            echo "ERROR: index.html missing in build/web; aborting"
            exit 1
          fi

      - name: Upload web artifact (debug / fallback)
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Deploy to gh-pages
        if: ${{ github.event.inputs.publish == 'true' || github.ref == 'refs/heads/main' }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true
